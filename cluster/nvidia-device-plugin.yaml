# NVIDIA device plugin with time-slicing used as VRAM accounting.
#
# The RTX 2060 has 6 GB and no memory isolation between processes, so the
# card is advertised as 12 "slots" of ~0.5 GB (nvidia.com/gpu: 12) and every
# GPU workload requests slots in proportion to the VRAM it actually holds:
#
#   AllTalk XTTS              7 slots  (~3.1 GB resident + headroom)
#   Ollama reservation        5 slots  (host Ollama, llama3.2 ~2.3 GB)
#   stocks weekly retrain     4 slots  (~1.9 GB peak)
#
# The scheduler then refuses to co-locate workloads that would not fit: the
# retrain waits (Pending) while the audiobook stack is up instead of dying
# with CUDA OOM, which is what happened when these ran side by side under
# cron. failRequestsGreaterThanOne=false lets a pod request several slots.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-config
  namespace: kube-system
data:
  config.yaml: |
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: false
        resources:
          - name: nvidia.com/gpu
            replicas: 12
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: nvidia-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvidia-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.0
          env:
            - name: CONFIG_FILE
              value: /config/config.yaml
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: config
          configMap:
            name: nvidia-device-plugin-config
