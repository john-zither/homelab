# Serves the static dashboard generated by the 'dashboard' CronJob.
# Only dashboard.html is mounted (read-only); the rest of the project, including
# keys.env, is not exposed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard-web}
  template:
    metadata:
      labels: {app: dashboard-web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - {name: http, containerPort: 80}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: dashboard, mountPath: /usr/share/nginx/html/index.html, readOnly: true}
      volumes:
        - name: dashboard
          hostPath: {path: /home/theurerjohn3/Documents/agents/stocks/dashboard.html, type: File}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-web
spec:
  type: NodePort
  selector: {app: dashboard-web}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30899}
