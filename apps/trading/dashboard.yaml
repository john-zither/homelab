# Regenerates dashboard.html after the close; served by the dashboard Deployment.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dashboard
spec:
  suspend: true               # enable with 'make trading-enable' once the crontab entries are removed
  schedule: "30 16 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app: dashboard}
        spec:
          restartPolicy: Never
          securityContext: {runAsUser: 1000, runAsGroup: 1000}
          containers:
            - name: dashboard
              image: homelab/stocks-runtime:latest
              imagePullPolicy: Never
              workingDir: /app
              command: ["bash", "-c"]
              # tee keeps logs/*.log current for the dashboard; pipefail keeps failures visible to k8s
              args: ["set -o pipefail; python generate_dashboard.py 2>&1 | tee -a logs/dashboard.log"]
              env:
                - {name: HOME, value: /tmp}
                - {name: MPLCONFIGDIR, value: /tmp}
                - {name: PYTHONUNBUFFERED, value: "1"}
              envFrom:
                - secretRef: {name: alpaca}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {memory: 2Gi}
              volumeMounts:
                - {name: project, mountPath: /app}
          volumes:
            - name: project
              hostPath: {path: /home/theurerjohn3/Documents/agents/stocks, type: Directory}
