# Live SMARD demand forecasting (smard/demand, demand.live).
#   demand-retrain   Sunday 03:00: refit LightGBM and the network on all data (GPU, 3 slots)
#   demand-forecast  daily 12:00: forecast tomorrow for all five regions, log it next to SMARD's
#                    forecast as published at that moment, and push the day's file and the
#                    scoreboard to GitHub, which also feeds the Pages site (CPU only)
# The push uses a deploy key with write access to that one repo, kept only in the Secret
# smard-deploy-key (id_ed25519, known_hosts). After a cluster rebuild, generate a new key:
#   ssh-keygen -t ed25519 -N "" -f key && ssh-keyscan -t ed25519 github.com > known_hosts
#   kubectl -n energy create secret generic smard-deploy-key --from-file=id_ed25519=key --from-file=known_hosts
#   gh repo deploy-key add key.pub -R john-zither/Smard-Forecasts --allow-write
# Times are Europe/Berlin, the timezone SMARD and the forecast day use.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demand-retrain
spec:
  schedule: "0 3 * * 0"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 172800   # a run missed while the machine was off still happens
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels: {app: demand-retrain}
        spec:
          restartPolicy: Never
          securityContext: {runAsUser: 1000, runAsGroup: 1000}
          containers:
            - name: retrain
              image: homelab/smard-runtime:latest
              imagePullPolicy: Never
              workingDir: /app
              command: ["bash", "-c"]
              args: ["set -o pipefail; mkdir -p live-state; python -m demand.live train 2>&1 | tee -a live-state/retrain.log"]
              env:
                - {name: HOME, value: /tmp}
              resources:
                requests: {cpu: "2", memory: 2Gi}
                limits: {nvidia.com/gpu: 3, memory: 6Gi}
              volumeMounts:
                - {name: project, mountPath: /app}
          volumes:
            - name: project
              hostPath: {path: /home/theurerjohn3/Documents/agents/smard/demand, type: Directory}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demand-forecast
spec:
  schedule: "0 12 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600     # a forecast issued much later than noon wouldn't be comparable
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app: demand-forecast}
        spec:
          restartPolicy: Never
          securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
          containers:
            - name: forecast
              image: homelab/smard-runtime:latest
              imagePullPolicy: Never
              workingDir: /app
              command: ["bash", "-c"]
              # ssh refuses a group-readable key, so take a private copy first.
              args: ["set -o pipefail; install -m 600 /secrets/id_ed25519 /tmp/id_ed25519; mkdir -p live-state; python -m demand.live forecast 2>&1 | tee -a live-state/forecast.log"]
              env:
                - {name: HOME, value: /tmp}
                - {name: CUDA_VISIBLE_DEVICES, value: ""}
                - {name: PUBLISH, value: "1"}
                - {name: GIT_SSH_COMMAND, value: "ssh -i /tmp/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/secrets/known_hosts"}
              resources:
                requests: {cpu: "1", memory: 1Gi}
                limits: {memory: 4Gi}
              volumeMounts:
                - {name: project, mountPath: /app}
                - {name: deploy-key, mountPath: /secrets, readOnly: true}
          volumes:
            - name: project
              hostPath: {path: /home/theurerjohn3/Documents/agents/smard/demand, type: Directory}
            - name: deploy-key
              secret: {secretName: smard-deploy-key, defaultMode: 0440}
