# Ollama runs on the host (systemd), shared with jobseeker and ragnas, so the
# scheduler cannot see its VRAM. While the audiobook stack is up, this
# placeholder pod holds Ollama's share of GPU slots, so nothing else is
# scheduled into memory the model is actually using. It does no work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gpu-reservation
spec:
  replicas: 0
  selector:
    matchLabels: {app: ollama-gpu-reservation}
  template:
    metadata:
      labels: {app: ollama-gpu-reservation}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 1m, memory: 8Mi}
            limits: {nvidia.com/gpu: 5, memory: 16Mi}
