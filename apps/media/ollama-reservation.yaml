# Ollama runs on the host (systemd), shared with jobseeker, so the scheduler
# cannot see its VRAM. While an audiobook Job attributes speakers with
# qwen2.5:7b (~5.4 GB, nearly the whole 6 GB card), this placeholder pod holds
# all 12 GPU slots, so nothing else is scheduled into memory the model is
# using. The audiobook driver scales it up for that phase and back down before
# AllTalk starts. It does no work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gpu-reservation
spec:
  replicas: 0
  selector:
    matchLabels: {app: ollama-gpu-reservation}
  template:
    metadata:
      labels: {app: ollama-gpu-reservation}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 1m, memory: 8Mi}
            limits: {nvidia.com/gpu: 12, memory: 16Mi}
